name: Test
permissions:
  contents: read
  id-token: write
on:
  pull_request:
  push:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: jdx/mise-action@v4.2.0 # zizmor: ignore[unpinned-uses] immutable tag
    - run: mise lint
    - uses: ./
      with:
        oidc-configuration-id: '414eac8b-5d17-4860-915f-37329ceb1dff'
    - uses: emulator-wtf/actions/setup-ew-cli@v1.1.0 # zizmor: ignore[unpinned-uses] immutable tag
    - run: ew-cli --models
